# =============================================================================
# application.yml：SpringBoot 后端的核心配置文件（路演默认走 H2 内嵌数据库，免安装）
# 修改本文件后需要重启后端才会生效。
# =============================================================================

server:
  # 后端 HTTP 端口，固定 8080，正好和前端 vite.config.js 里 /api 的代理目标一致
  port: 8080

spring:
  application:
    # 应用名称，仅用于日志展示
    name: petos-monitor-backend

  # ---------------------------------------------------------------------------
  # 数据源配置：默认使用 H2 内存数据库
  # ---------------------------------------------------------------------------
  datasource:
    # jdbc:h2:mem 表示数据存在内存里，后端一重启就清空，再由 data.sql 自动预置，演示数据始终一致
    url: jdbc:h2:mem:monitor_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    # H2 数据库的驱动类与账号密码（路演内置，随手可登）
    driver-class-name: org.h2.Driver
    username: sa
    password: "123456"

  # H2 自带的网页控制台，浏览器打开 http://localhost:8080/h2-console 可直接看表数据
  h2:
    console:
      enabled: true          # 打开控制台
      path: /h2-console      # 控制台访问地址
      settings:
        web-allow-others: true # 允许局域网其它设备访问（香橙派调试时方便）

  # ---------------------------------------------------------------------------
  # JPA / Hibernate 配置：负责自动建表、SQL 显示
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      # update：启动时根据实体类自动创建/更新表结构，路演不用手写建表语句
      ddl-auto: update
    # 在控制台打印实际执行的 SQL，方便答辩时讲“数据是怎么落库的”
    show-sql: true
    properties:
      hibernate:
        format_sql: true     # 把打印的 SQL 格式化，方便阅读
    # 关键：让 data.sql 在 Hibernate 建完表之后再执行，否则会报“表不存在”
    defer-datasource-initialization: true

  # 启动时执行这个初始化脚本，预置 1 台 ESP32、1 台香橙派、几条告警记录
  sql:
    init:
      mode: always           # 每次启动都执行 data.sql

# =============================================================================
# 【切换 MySQL 时的注释配置】路演不需要，正式部署时把上面 H2 数据源注释掉，
# 再把下面这段取消注释，并确保已经建库 CREATE DATABASE petos_monitor DEFAULT CHARSET utf8mb4;
# =============================================================================
# spring:
#   datasource:
#     url: jdbc:mysql://127.0.0.1:3306/petos_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
#     driver-class-name: com.mysql.cj.jdbc.Driver
#     username: root
#     password: "你的密码"
#   jpa:
#     hibernate:
#       ddl-auto: update

# =============================================================================
# 自定义配置：MQTT（EMQX）连接信息
# =============================================================================
mqtt:
  # EMQX 所在服务器地址，本地单机演示就写 127.0.0.1
  broker-host: 127.0.0.1
  # EMQX 的 TCP 端口默认 1883（后端是 Java 程序，用 TCP，不是浏览器的 ws）
  broker-port: 1883
  # EMQX 控制台里创建的账号密码；若允许匿名，可留空
  username: petos
  password: "petos123"
  # 后端这个 MQTT 客户端的唯一编号，随便起名但要保证不跟设备重复
  client-id: petos-backend-server
  # 连接超时（秒）与心跳保活间隔（秒），用来维持长连接
  connection-timeout: 10
  keep-alive-interval: 30

# =============================================================================
# 自定义业务配置：图片存储路径、设备心跳超时判断
# =============================================================================
app:
  upload:
    # 抓拍图片保存的本地文件夹；相对路径表示从工程运行目录开始，会自动创建
    path: ./upload-images
    # 前端通过这个 URL 前缀访问图片，配合静态资源映射使用
    url-prefix: /images
  heartbeat:
    # 设备超过这个秒数没上报心跳，就判定为离线
    timeout-seconds: 60
